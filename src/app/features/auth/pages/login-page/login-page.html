<section class="window">
  <div class="titlebar">INGRESE SU IDENTIFICACION</div>

  <div class="brand">
    <img src="assets/images/banner2vsiaf.jpg" alt="vSIAF - Sistema de Activos Fijos" />
  </div>

  <form class="login" [formGroup]="form" (ngSubmit)="submit()">
    <h2 class="login-title">Login</h2>

    <label class="row">
      <span>Nombre del Usuario:</span>
      <input type="text" formControlName="username" autocomplete="username" />
    </label>

    <label class="row">
      <span>Contraseña:</span>
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>

    @if (error(); as message) {
      <p class="error" role="alert">{{ message }}</p>
    }

    <div class="actions">
      <strong>NOTA: Es sensible al contexto</strong>
      <button type="submit" [disabled]="loading()">Aceptar</button>
    </div>
  </form>

  <footer class="footer">
    <strong>vSIAF versión 3.2</strong>
    <strong>Copyright © 1999-2013 DGSGIF</strong>
    <strong>Todos los derechos reservados</strong>
  </footer>
</section>
